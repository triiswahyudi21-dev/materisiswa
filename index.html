<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Portal Siswa - E-Learning IPS SMP/MTs</title>

  <!-- Google Font: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React & ReactDOM Standalone (Production Mode) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>

  <!-- Firebase App & Auth & Firestore (Compat SDK untuk kompatibilitas HP) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <!-- Lucide Icons Unpkg -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    html, body, #root {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      background-color: #020617;
    }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #090d16;
    }
    ::-webkit-scrollbar-thumb {
      background: #1e293b;
      border-radius: 9999px;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 antialiased selection:bg-blue-500 selection:text-white">
  <div id="root"></div>

  <script>
    const e = React.createElement;

    // Konfigurasi Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyD3M8FfqHdzCRO3VCKB24xPEcEZgVVK--M",
      authDomain: "gen-lang-client-0031221493.firebaseapp.com",
      databaseURL: "https://gen-lang-client-0031221493-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "gen-lang-client-0031221493",
      storageBucket: "gen-lang-client-0031221493.firebasestorage.app",
      messagingSenderId: "514951591302",
      appId: "1:514951591302:web:65d128106e2d2f3663e807",
      measurementId: "G-VF7M8CDSYQ"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const auth = firebase.auth();
    const db = firebase.firestore();

    const broadcast = typeof window !== 'undefined' && 'BroadcastChannel' in window
      ? new BroadcastChannel('elearning_ips_realtime_channel')
      : null;

    function StudentApp() {
      const [appSession, setAppSession] = React.useState(() => {
        const saved = localStorage.getItem('elearning_student_session_v3');
        return saved ? JSON.parse(saved) : null;
      });

      const [materials, setMaterials] = React.useState(() => {
        const local = localStorage.getItem('elearning_materials_v3');
        return local ? JSON.parse(local) : [];
      });

      const [questions, setQuestions] = React.useState(() => {
        const local = localStorage.getItem('elearning_questions_v3');
        return local ? JSON.parse(local) : [];
      });

      const [students, setStudents] = React.useState(() => {
        const local = localStorage.getItem('elearning_students_v3');
        return local ? JSON.parse(local) : [];
      });

      const [scores, setScores] = React.useState(() => {
        const local = localStorage.getItem('elearning_scores_v3');
        return local ? JSON.parse(local) : [];
      });

      const [activeTab, setActiveTab] = React.useState('dashboard');
      const [selectedMaterial, setSelectedMaterial] = React.useState(null);
      const [notification, setNotification] = React.useState(null);

      const [loginSiswaKelas, setLoginSiswaKelas] = React.useState('7');
      const [loginSiswaSubKelas, setLoginSiswaSubKelas] = React.useState('A');
      const [loginSiswaName, setLoginSiswaName] = React.useState('');

      React.useEffect(() => {
        auth.signInAnonymously().catch(() => {});
      }, []);

      React.useEffect(() => {
        setTimeout(() => {
          if (window.lucide) window.lucide.createIcons();
        }, 100);
      }, [activeTab, appSession, selectedMaterial]);

      const showNotification = (msg) => {
        setNotification(msg);
        setTimeout(() => setNotification(null), 4000);
      };

      const handleSiswaLogin = (ev) => {
        ev.preventDefault();
        if (!loginSiswaName) {
          showNotification("Silakan pilih atau masukkan nama siswa!");
          return;
        }
        const session = {
          username: loginSiswaName,
          kelas: loginSiswaKelas,
          subKelas: loginSiswaSubKelas
        };
        setAppSession(session);
        localStorage.setItem('elearning_student_session_v3', JSON.stringify(session));
        setActiveTab('dashboard');
      };

      const handleLogout = () => {
        setAppSession(null);
        localStorage.removeItem('elearning_student_session_v3');
        setActiveTab('dashboard');
        setSelectedMaterial(null);
      };

      if (!appSession) {
        return e('div', { className: 'w-full min-h-screen bg-slate-950 flex flex-col justify-center items-center p-4 relative' },
          e('div', { className: 'w-full max-w-md bg-slate-900 border border-slate-800 rounded-3xl p-6 sm:p-8 shadow-2xl z-10' },
            e('div', { className: 'text-center mb-6' },
              e('h1', { className: 'text-xl sm:text-2xl font-extrabold text-white' }, 'Portal Belajar Siswa IPS'),
              e('p', { className: 'text-slate-400 text-xs mt-1' }, 'E-Learning Space & Interactive Module')
            ),
            notification && e('div', { className: 'bg-red-500/20 border border-red-500/30 text-red-300 px-3 py-2 rounded-xl text-xs text-center mb-4' }, notification),
            e('form', { onSubmit: handleSiswaLogin, className: 'space-y-4' },
              e('div', { className: 'grid grid-cols-2 gap-3' },
                e('div', null,
                  e('label', { className: 'block text-xs font-semibold text-slate-400 mb-1' }, 'Kelas'),
                  e('select', {
                    value: loginSiswaKelas,
                    onChange: (ev) => setLoginSiswaKelas(ev.target.value),
                    className: 'w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-slate-200 text-xs outline-none'
                  },
                    e('option', { value: '7' }, 'Kelas 7'),
                    e('option', { value: '8' }, 'Kelas 8'),
                    e('option', { value: '9' }, 'Kelas 9')
                  )
                ),
                e('div', null,
                  e('label', { className: 'block text-xs font-semibold text-slate-400 mb-1' }, 'Rombel'),
                  e('select', {
                    value: loginSiswaSubKelas,
                    onChange: (ev) => setLoginSiswaSubKelas(ev.target.value),
                    className: 'w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-slate-200 text-xs outline-none'
                  },
                    e('option', { value: 'A' }, 'Rombel A'),
                    e('option', { value: 'B' }, 'Rombel B'),
                    e('option', { value: 'C' }, 'Rombel C'),
                    e('option', { value: 'D' }, 'Rombel D')
                  )
                )
              ),
              e('div', null,
                e('label', { className: 'block text-xs font-semibold text-slate-400 mb-1' }, 'Nama Lengkap Siswa'),
                e('input', {
                  type: 'text',
                  placeholder: 'Ketik Nama Lengkap Siswa...',
                  value: loginSiswaName,
                  onChange: (ev) => setLoginSiswaName(ev.target.value),
                  required: true,
                  className: 'w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-slate-200 text-xs outline-none'
                })
              ),
              e('button', {
                type: 'submit',
                className: 'w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded-xl transition-all shadow-lg text-xs'
              }, 'Masuk Pembelajaran Siswa')
            )
          )
        );
      }

      const myClassMaterials = materials.filter(m => {
        if (m.kelas !== appSession.kelas) return false;
        if (m.subKelasTarget && m.subKelasTarget !== 'semua' && m.subKelasTarget !== appSession.subKelas) return false;
        return true;
      });

      return e('div', { className: 'w-full min-h-screen bg-slate-950 text-slate-100 flex flex-col' },
        e('nav', { className: 'bg-slate-900 border-b border-slate-800 sticky top-0 z-40 w-full px-4 py-3 flex justify-between items-center' },
          e('div', { className: 'flex items-center gap-2' },
            e('span', { className: 'text-sm font-extrabold text-white' }, 'Portal Siswa IPS')
          ),
          e('div', { className: 'flex items-center gap-3' },
            e('span', { className: 'text-xs text-slate-300' }, appSession.username),
            e('button', {
              onClick: handleLogout,
              className: 'bg-red-500/10 text-red-400 border border-red-500/20 px-3 py-1 rounded-xl text-xs font-semibold'
            }, 'Keluar')
          )
        ),
        e('main', { className: 'flex-1 p-4 sm:p-6 space-y-4' },
          e('div', { className: 'bg-slate-900 border border-slate-800 p-4 rounded-2xl' },
            e('h2', { className: 'text-base font-bold text-white' }, `Materi Kelas ${appSession.kelas}${appSession.subKelas}`),
            e('p', { className: 'text-slate-400 text-xs mt-1' }, 'Pilih materi di bawah ini untuk dibaca.')
          ),
          e('div', { className: 'grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4' },
            myClassMaterials.map(m => 
              e('div', {
                key: m.id,
                onClick: () => setSelectedMaterial(m),
                className: 'bg-slate-900 border border-slate-800 rounded-2xl p-4 cursor-pointer hover:border-blue-500 transition-all'
              },
                e('h3', { className: 'font-bold text-white text-sm mb-1' }, m.title),
                e('p', { className: 'text-xs text-slate-400 line-clamp-2' }, m.content)
              )
            ),
            myClassMaterials.length === 0 && e('div', { className: 'col-span-full p-8 text-center text-slate-500 text-xs border border-dashed border-slate-800 rounded-2xl' }, 'Belum ada materi untuk kelas Anda.')
          )
        )
      );
    }

    const container = document.getElementById('root');
    const root = ReactDOM.createRoot(container);
    root.render(e(StudentApp));
  </script>
</body>
</html>
