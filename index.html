<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portal Siswa - E-Learning IPS</title>

  <!-- Google Font & Tailwind CSS -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Babel Standalone untuk JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 9999px; }
  </style>

  <!-- Import Map React & Firebase -->
  <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
        "firebase/app": "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js",
        "firebase/auth": "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js",
        "firebase/firestore": "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js",
        "lucide-react": "https://esm.sh/lucide-react@0.263.1"
      }
    }
  </script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen antialiased selection:bg-blue-500 selection:text-white">
  <div id="root"></div>

  <script type="text/babel" data-type="module">
    import React, { useState, useEffect } from 'react';
    import { createRoot } from 'react-dom/client';
    import { initializeApp } from 'firebase/app';
    import { getAuth, signInAnonymously, signInWithCustomToken } from 'firebase/auth';
    import { getFirestore, collection, onSnapshot, doc, setDoc } from 'firebase/firestore';
    import { 
      BookOpen, Clock, CheckCircle, AlertTriangle, User, LogIn, LogOut, 
      ArrowLeft, Award, FileText, Send, Sparkles, RefreshCw
    } from 'lucide-react';

    // Konfigurasi Firebase (HARUS SAMA DENGAN PORTAL GURU)
    const firebaseConfig = {
      apiKey: "AIzaSyD3M8FfqHdzCRO3VCKB24xPEcEZgVVK--M",
      authDomain: "gen-lang-client-0031221493.firebaseapp.com",
      databaseURL: "https://gen-lang-client-0031221493-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "gen-lang-client-0031221493",
      storageBucket: "gen-lang-client-0031221493.firebasestorage.app",
      messagingSenderId: "514951591302",
      appId: "1:514951591302:web:65d128106e2d2f3663e807",
      measurementId: "G-VF7M8CDSYQ"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const appId = typeof __app_id !== 'undefined' ? __app_id : 'elearning-ips-v3';

    // BroadcastChannel Sync Realtime
    const broadcast = typeof window !== 'undefined' && 'BroadcastChannel' in window
      ? new BroadcastChannel('elearning_ips_realtime_channel')
      : null;

    function StudentApp() {
      const [studentSession, setStudentSession] = useState(() => {
        const saved = localStorage.getItem('elearning_siswa_session_v3');
        return saved ? JSON.parse(saved) : null;
      });

      const [materials, setMaterials] = useState([]);
      const [questions, setQuestions] = useState([]);
      const [scores, setScores] = useState(() => {
        const local = localStorage.getItem('elearning_scores_v3');
        return local ? JSON.parse(local) : [];
      });

      const [selectedMaterial, setSelectedMaterial] = useState(null);
      const [timerSeconds, setTimerSeconds] = useState(0);
      const [timerActive, setTimerActive] = useState(false);
      const [isWarningState, setIsWarningState] = useState(false);
      const [isReadCompleted, setIsReadCompleted] = useState(false);
      const [quizMode, setQuizMode] = useState(false);
      const [userAnswers, setUserAnswers] = useState({});
      const [quizResult, setQuizResult] = useState(null);

      // State Login Siswa
      const [loginName, setLoginName] = useState('');
      const [loginKelas, setLoginKelas] = useState('7');
      const [loginSubKelas, setLoginSubKelas] = useState('A');

      // Persistence Session
      useEffect(() => {
        if (studentSession) {
          localStorage.setItem('elearning_siswa_session_v3', JSON.stringify(studentSession));
        } else {
          localStorage.removeItem('elearning_siswa_session_v3');
        }
      }, [studentSession]);

      // REALTIME FIRESTORE LISTENER (SINKRONISASI MATERI DARI GURU)
      useEffect(() => {
        const initAuth = async () => {
          try {
            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
              await signInWithCustomToken(auth, __initial_auth_token);
            } else {
              await signInAnonymously(auth);
            }
          } catch (e) {
            console.log("Firebase fallback mode");
          }
        };
        initAuth();

        // 1. Dapatkan Materi dari Cloud Firestore
        const materialsCol = collection(db, 'artifacts', appId, 'public', 'data', 'materials');
        const unsubMaterials = onSnapshot(materialsCol, (snapshot) => {
          const list = snapshot.docs.map(doc => doc.data());
          setMaterials(list);
          // Simpan backup ke localStorage
          localStorage.setItem('elearning_materials_v3', JSON.stringify(list));
        }, (err) => {
          // Fallback ke localStorage jika koneksi terganggu
          const local = localStorage.getItem('elearning_materials_v3');
          if (local) setMaterials(JSON.parse(local));
        });

        // 2. Dapatkan Soal Kuis dari Cloud Firestore
        const questionsCol = collection(db, 'artifacts', appId, 'public', 'data', 'questions');
        const unsubQuestions = onSnapshot(questionsCol, (snapshot) => {
          const list = snapshot.docs.map(doc => doc.data());
          setQuestions(list);
          localStorage.setItem('elearning_questions_v3', JSON.stringify(list));
        }, (err) => {
          const local = localStorage.getItem('elearning_questions_v3');
          if (local) setQuestions(JSON.parse(local));
        });

        return () => {
          unsubMaterials();
          unsubQuestions();
        };
      }, []);

      // Broadcast Listener (Apabila Guru Mung-Reset Status)
      useEffect(() => {
        if (!broadcast) return;
        const handleMessage = (event) => {
          const { type, payload } = event.data || {};
          if (type === 'TEACHER_RESET_STATUS' && studentSession) {
            if (payload.studentName === studentSession.name) {
              setIsWarningState(false);
              setTimerActive(true);
            }
          }
        };
        broadcast.addEventListener('message', handleMessage);
        return () => broadcast.removeEventListener('message', handleMessage);
      }, [studentSession]);

      // Peringatan Pindah Tab (Tab Visibility API)
      useEffect(() => {
        const handleVisibilityChange = () => {
          if (document.hidden && timerActive && selectedMaterial && studentSession) {
            setIsWarningState(true);
            setTimerActive(false);

            const presKey = `${studentSession.id}_${selectedMaterial.id}`;
            const updatePayload = {
              id: presKey,
              studentId: studentSession.id,
              studentName: studentSession.name,
              kelas: `${studentSession.kelas}${studentSession.subKelas}`,
              materialId: selectedMaterial.id,
              materialTitle: selectedMaterial.title,
              remainingSeconds: timerSeconds,
              status: 'warning',
              lastUpdated: Date.now()
            };

            if (broadcast) {
              broadcast.postMessage({ type: 'STUDENT_PRESENCE_UPDATE', payload: updatePayload });
            }
            try {
              const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'student_presence', presKey);
              setDoc(docRef, updatePayload);
            } catch (e) {}
          }
        };

        document.addEventListener('visibilitychange', handleVisibilityChange);
        return () => document.removeEventListener('visibilitychange', handleVisibilityChange);
      }, [timerActive, selectedMaterial, studentSession, timerSeconds]);

      // Count Down Timer
      useEffect(() => {
        let interval = null;
        if (timerActive && timerSeconds > 0) {
          interval = setInterval(() => {
            setTimerSeconds(prev => {
              const nextVal = prev - 1;
              
              // Sync Kehadiran & Timer Sisa ke Guru
              if (selectedMaterial && studentSession) {
                const presKey = `${studentSession.id}_${selectedMaterial.id}`;
                const updatePayload = {
                  id: presKey,
                  studentId: studentSession.id,
                  studentName: studentSession.name,
                  kelas: `${studentSession.kelas}${studentSession.subKelas}`,
                  materialId: selectedMaterial.id,
                  materialTitle: selectedMaterial.title,
                  remainingSeconds: nextVal,
                  status: nextVal <= 0 ? 'completed' : 'active',
                  lastUpdated: Date.now()
                };

                if (broadcast) broadcast.postMessage({ type: 'STUDENT_PRESENCE_UPDATE', payload: updatePayload });
                try {
                  const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'student_presence', presKey);
                  setDoc(docRef, updatePayload);
                } catch (e) {}
              }

              if (nextVal <= 0) {
                setTimerActive(false);
                setIsReadCompleted(true);
                return 0;
              }
              return nextVal;
            });
          }, 1000);
        }
        return () => clearInterval(interval);
      }, [timerActive, timerSeconds, selectedMaterial, studentSession]);

      // Handle Login Siswa
      const handleStudentLogin = (e) => {
        e.preventDefault();
        if (!loginName.trim()) return;

        const stuSession = {
          id: 'stu_' + Date.now(),
          name: loginName.trim(),
          kelas: loginKelas,
          subKelas: loginSubKelas
        };

        setStudentSession(stuSession);
      };

      // Buka Detail Materi
      const handleOpenMaterial = (mat) => {
        setSelectedMaterial(mat);
        const durationSecs = (mat.durationMinutes || 15) * 60;
        setTimerSeconds(durationSecs);
        setTimerActive(true);
        setIsWarningState(false);
        setIsReadCompleted(false);
        setQuizMode(false);
        setUserAnswers({});
        setQuizResult(null);

        // Notify Presence Pertama Kali
        if (studentSession) {
          const presKey = `${studentSession.id}_${mat.id}`;
          const updatePayload = {
            id: presKey,
            studentId: studentSession.id,
            studentName: studentSession.name,
            kelas: `${studentSession.kelas}${studentSession.subKelas}`,
            materialId: mat.id,
            materialTitle: mat.title,
            remainingSeconds: durationSecs,
            status: 'active',
            lastUpdated: Date.now()
          };

          if (broadcast) broadcast.postMessage({ type: 'STUDENT_PRESENCE_UPDATE', payload: updatePayload });
          try {
            const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'student_presence', presKey);
            setDoc(docRef, updatePayload);
          } catch (e) {}
        }
      };

      // Kirim Jawaban Kuis
      const handleSubmitQuiz = () => {
        const matQuestions = questions.filter(q => q.materialId === selectedMaterial.id);
        if (matQuestions.length === 0) return;

        let correctCount = 0;
        matQuestions.forEach(q => {
          const ans = userAnswers[q.id];
          if (ans && ans.toString().trim().toLowerCase() === q.correctAnswer.toString().trim().toLowerCase()) {
            correctCount++;
          }
        });

        const calculatedScore = Math.round((correctCount / matQuestions.length) * 100);
        
        const newScoreObj = {
          id: 'score_' + Date.now(),
          studentId: studentSession.id,
          studentName: studentSession.name,
          kelas: studentSession.kelas,
          subKelas: studentSession.subKelas,
          materialId: selectedMaterial.id,
          materialTitle: selectedMaterial.title,
          score: calculatedScore,
          createdAt: Date.now()
        };

        const updatedScores = [newScoreObj, ...scores];
        setScores(updatedScores);
        localStorage.setItem('elearning_scores_v3', JSON.stringify(updatedScores));
        setQuizResult(calculatedScore);
      };

      // Screen 1: Form Login Siswa
      if (!studentSession) {
        return (
          <div className="min-h-screen bg-slate-950 flex flex-col justify-center items-center p-4 relative overflow-hidden">
            <div className="absolute -top-40 -left-40 w-96 h-96 bg-blue-600/20 rounded-full blur-3xl pointer-events-none"></div>
            <div className="absolute -bottom-40 -right-40 w-96 h-96 bg-emerald-600/20 rounded-full blur-3xl pointer-events-none"></div>

            <div className="w-full max-w-md bg-slate-900/90 backdrop-blur-xl border border-slate-800 rounded-3xl p-6 sm:p-8 shadow-2xl relative z-10">
              <div className="text-center mb-6">
                <div className="inline-flex p-3 bg-gradient-to-tr from-blue-600 to-emerald-500 rounded-2xl shadow-lg shadow-blue-500/30 mb-3">
                  <BookOpen className="w-8 h-8 text-white" />
                </div>
                <h1 className="text-2xl font-extrabold text-white tracking-tight">Portal Siswa E-Learning</h1>
                <p className="text-slate-400 text-xs mt-1">Mata Pelajaran Ilmu Pengetahuan Sosial (IPS)</p>
              </div>

              <form onSubmit={handleStudentLogin} className="space-y-4">
                <div>
                  <label className="block text-xs font-semibold text-slate-400 mb-1">Nama Lengkap Siswa</label>
                  <input 
                    type="text" 
                    required 
                    placeholder="Masukkan nama lengkap Anda..."
                    value={loginName}
                    onChange={(e) => setLoginName(e.target.value)}
                    className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-xs text-white outline-none focus:border-blue-500"
                  />
                </div>

                <div className="grid grid-cols-2 gap-3">
                  <div>
                    <label className="block text-xs font-semibold text-slate-400 mb-1">Tingkat Kelas</label>
                    <select 
                      value={loginKelas} 
                      onChange={(e) => setLoginKelas(e.target.value)}
                      className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-xs text-white"
                    >
                      <option value="7">Kelas 7</option>
                      <option value="8">Kelas 8</option>
                      <option value="9">Kelas 9</option>
                    </select>
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-slate-400 mb-1">Rombel / Kelas</label>
                    <select 
                      value={loginSubKelas} 
                      onChange={(e) => setLoginSubKelas(e.target.value)}
                      className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-xs text-white"
                    >
                      <option value="A">Rombel A</option>
                      <option value="B">Rombel B</option>
                      <option value="C">Rombel C</option>
                      <option value="D">Rombel D</option>
                    </select>
                  </div>
                </div>

                <button type="submit" className="w-full mt-2 bg-gradient-to-r from-blue-600 to-emerald-600 hover:from-blue-500 hover:to-emerald-500 text-white font-bold py-3 rounded-xl transition-all shadow-lg shadow-blue-600/30 flex justify-center items-center gap-2 text-xs active:scale-95">
                  <LogIn className="w-4 h-4" /> Masuk Portal Ruang Belajar
                </button>
              </form>
            </div>
          </div>
        );
      }

      // Filter Materi Sesuai Kelas Siswa & Semua Rombel
      const availableMaterials = materials.filter(m => {
        const matchKelas = m.kelas === studentSession.kelas;
        const matchSubKelas = m.subKelasTarget === 'semua' || m.subKelasTarget === studentSession.subKelas;
        return matchKelas && matchSubKelas;
      });

      // Screen 2: Tampilan Membaca Materi / Mengerjakan Kuis
      if (selectedMaterial) {
        const mins = Math.floor(timerSeconds / 60);
        const secs = timerSeconds % 60;
        const timeStr = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        const matQuestions = questions.filter(q => q.materialId === selectedMaterial.id);

        return (
          <div className="min-h-screen bg-slate-950 text-slate-100 pb-12">
            {/* Header Sticky Timer */}
            <div className="bg-slate-900/90 backdrop-blur-md border-b border-slate-800 sticky top-0 z-40 px-4 py-3">
              <div className="max-w-4xl mx-auto flex justify-between items-center">
                <button 
                  onClick={() => { setSelectedMaterial(null); setTimerActive(false); }}
                  className="text-slate-400 hover:text-white flex items-center gap-1 text-xs font-semibold"
                >
                  <ArrowLeft className="w-4 h-4"/> Kembalikan ke Daftar
                </button>

                <div className="flex items-center gap-3">
                  <div className={`px-3 py-1.5 rounded-xl border flex items-center gap-2 text-xs font-bold font-mono ${isWarningState ? 'bg-yellow-500/20 border-yellow-500/40 text-yellow-300' : 'bg-slate-950 border-slate-800 text-amber-400'}`}>
                    <Clock className="w-4 h-4 animate-spin text-amber-400" />
                    Sisa Waktu: {timeStr}
                  </div>
                </div>
              </div>
            </div>

            <div className="max-w-4xl mx-auto p-4 sm:p-6 space-y-6">
              {/* Notifikasi Peringatan Pindah Tab */}
              {isWarningState && (
                <div className="bg-yellow-500/20 border border-yellow-500/40 p-4 rounded-2xl flex items-center gap-3 text-xs text-yellow-200 animate-pulse">
                  <AlertTriangle className="w-6 h-6 text-yellow-400 shrink-0" />
                  <div>
                    <span className="font-bold">PERINGATAN SISWA:</span> Anda terdeteksi berpindah tab/membuka aplikasi lain. Fokus kembali membaca materi ini agar guru dapat memverifikasi status Anda.
                  </div>
                </div>
              )}

              {/* Konten Utama Bacaan */}
              {!quizMode ? (
                <div className="bg-slate-900 border border-slate-800 rounded-3xl p-5 sm:p-8 shadow-2xl space-y-6">
                  {selectedMaterial.imageUrl && (
                    <img src={selectedMaterial.imageUrl} alt={selectedMaterial.title} className="w-full h-64 sm:h-80 object-cover rounded-2xl" />
                  )}

                  <div>
                    <div className="flex items-center gap-2 mb-2">
                      <span className="bg-blue-500/10 text-blue-400 text-[11px] font-bold px-2.5 py-1 rounded-lg border border-blue-500/20">
                        Kelas {selectedMaterial.kelas} • IPS
                      </span>
                      <span className="text-slate-500 text-xs">• Oleh {selectedMaterial.createdBy || 'Guru Pengajar'}</span>
                    </div>
                    <h1 className="text-xl sm:text-2xl font-extrabold text-white leading-snug">{selectedMaterial.title}</h1>
                  </div>

                  <div className="prose prose-invert max-w-none text-slate-300 text-xs sm:text-sm leading-relaxed whitespace-pre-line border-t border-b border-slate-800 py-6">
                    {selectedMaterial.content}
                  </div>

                  {selectedMaterial.source && (
                    <p className="text-[11px] text-slate-500 italic">Sumber Referensi: {selectedMaterial.source}</p>
                  )}

                  <div className="pt-2 flex justify-end">
                    <button 
                      onClick={() => setQuizMode(true)}
                      className={`px-6 py-3 rounded-xl font-bold text-xs flex items-center gap-2 shadow-lg transition-all active:scale-95 ${isReadCompleted || timerSeconds === 0 ? 'bg-emerald-600 hover:bg-emerald-500 text-white shadow-emerald-600/30' : 'bg-blue-600 hover:bg-blue-500 text-white shadow-blue-600/30'}`}
                    >
                      <Sparkles className="w-4 h-4"/> Mulai Mengerjakan Soal Latihan & Evaluasi
                    </button>
                  </div>
                </div>
              ) : (
                /* Mode Mengerjakan Soal Latihan */
                <div className="bg-slate-900 border border-slate-800 rounded-3xl p-5 sm:p-8 shadow-2xl space-y-6">
                  <div className="border-b border-slate-800 pb-4 flex justify-between items-center">
                    <div>
                      <h2 className="text-lg font-bold text-white">Soal Evaluasi Materi IPS</h2>
                      <p className="text-slate-400 text-xs">{selectedMaterial.title}</p>
                    </div>
                    <button onClick={() => setQuizMode(false)} className="text-xs text-blue-400 hover:underline">
                      Kembali Baca Materi
                    </button>
                  </div>

                  {quizResult === null ? (
                    <div className="space-y-6">
                      {matQuestions.map((q, idx) => (
                        <div key={q.id} className="bg-slate-950 p-4 sm:p-5 rounded-2xl border border-slate-800 space-y-3">
                          <p className="font-semibold text-xs text-white">{idx + 1}. {q.questionText}</p>

                          {q.type === 'pg' ? (
                            <div className="space-y-2">
                              {['A', 'B', 'C', 'D'].map((optKey) => {
                                const optionLabel = q[`option${optKey}`];
                                if (!optionLabel) return null;
                                return (
                                  <label key={optKey} className={`flex items-center gap-3 p-3 rounded-xl border text-xs cursor-pointer transition-all ${userAnswers[q.id] === optKey ? 'bg-blue-600/20 border-blue-500 text-white' : 'bg-slate-900 border-slate-800 text-slate-300 hover:bg-slate-800'}`}>
                                    <input 
                                      type="radio" 
                                      name={`q_${q.id}`} 
                                      checked={userAnswers[q.id] === optKey} 
                                      onChange={() => setUserAnswers(prev => ({ ...prev, [q.id]: optKey }))}
                                      className="hidden" 
                                    />
                                    <span className="font-bold w-5 h-5 rounded-full bg-slate-800 flex justify-center items-center text-[10px]">{optKey}</span>
                                    <span>{optionLabel}</span>
                                  </label>
                                );
                              })}
                            </div>
                          ) : (
                            <input 
                              type="text" 
                              placeholder="Ketikkan jawaban Anda di sini..."
                              value={userAnswers[q.id] || ''} 
                              onChange={(e) => setUserAnswers(prev => ({ ...prev, [q.id]: e.target.value }))}
                              className="w-full bg-slate-900 border border-slate-800 rounded-xl p-3 text-xs text-white outline-none focus:border-blue-500"
                            />
                          )}
                        </div>
                      ))}

                      {matQuestions.length === 0 && (
                        <p className="text-center text-slate-500 text-xs py-8">Belum ada soal latihan yang dibuat oleh guru untuk materi ini.</p>
                      )}

                      {matQuestions.length > 0 && (
                        <button 
                          onClick={handleSubmitQuiz}
                          className="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-xl transition-all shadow-lg shadow-emerald-600/30 text-xs flex justify-center items-center gap-2 active:scale-95"
                        >
                          <Send className="w-4 h-4"/> Kirim Jawaban Evaluasi Saya
                        </button>
                      )}
                    </div>
                  ) : (
                    /* Hasil Kuis */
                    <div className="text-center py-8 space-y-4">
                      <div className="inline-flex p-4 bg-emerald-500/20 text-emerald-400 rounded-full border border-emerald-500/30 mb-2">
                        <Award className="w-12 h-12" />
                      </div>
                      <h3 className="text-xl font-bold text-white">Evaluasi Selesai!</h3>
                      <div className="text-4xl font-extrabold text-emerald-400 font-mono">{quizResult} / 100</div>
                      <p className="text-slate-400 text-xs max-w-sm mx-auto">
                        Nilai Anda telah otomatis tersimpan dan terkirim ke Rekap Nilai Guru.
                      </p>
                      <button 
                        onClick={() => { setSelectedMaterial(null); setQuizMode(false); }}
                        className="mt-4 px-6 py-2.5 bg-slate-800 hover:bg-slate-700 text-white rounded-xl text-xs font-bold transition-all"
                      >
                        Kembali ke Halaman Utama
                      </button>
                    </div>
                  )}
                </div>
              )}
            </div>
          </div>
        );
      }

      // Screen 3: Halaman Utama Siswa (Daftar Materi IPS)
      return (
        <div className="min-h-screen bg-slate-950 text-slate-100">
          <nav className="bg-slate-900/90 backdrop-blur-md border-b border-slate-800 sticky top-0 z-40">
            <div className="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
              <div className="flex items-center gap-2.5">
                <div className="bg-gradient-to-tr from-blue-600 to-emerald-500 p-2 rounded-xl text-white">
                  <BookOpen className="w-5 h-5" />
                </div>
                <div>
                  <h1 className="text-sm font-extrabold text-white">E-Learning IPS</h1>
                  <p className="text-[10px] text-slate-400">Portal Siswa SMP/MTs</p>
                </div>
              </div>

              <div className="flex items-center gap-3">
                <div className="text-right hidden sm:block">
                  <div className="text-xs font-bold text-white">{studentSession.name}</div>
                  <div className="text-[10px] text-emerald-400 font-semibold">Kelas {studentSession.kelas}{studentSession.subKelas}</div>
                </div>
                <button 
                  onClick={() => setStudentSession(null)} 
                  className="p-2 text-slate-400 hover:text-red-400 bg-slate-950 border border-slate-800 rounded-xl transition-all" 
                  title="Keluar"
                >
                  <LogOut className="w-4 h-4" />
                </button>
              </div>
            </div>
          </nav>

          <main className="max-w-6xl mx-auto px-4 py-6 space-y-6">
            <div className="bg-gradient-to-r from-blue-900/40 to-slate-900 border border-slate-800 p-6 rounded-3xl relative overflow-hidden shadow-xl">
              <div className="relative z-10">
                <span className="bg-blue-500/20 text-blue-300 text-[10px] font-bold px-2.5 py-1 rounded-lg border border-blue-500/30">
                  Selamat Datang, {studentSession.name}
                </span>
                <h2 className="text-lg sm:text-xl font-bold text-white mt-2">Daftar Materi Pembelajaran IPS Terbit</h2>
                <p className="text-slate-400 text-xs mt-1">Pilih materi IPS di bawah ini untuk mulai membaca dan mengerjakan kuis evaluasi.</p>
              </div>
            </div>

            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
              {availableMaterials.map((m) => (
                <div key={m.id} className="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden flex flex-col hover:border-slate-700 transition-all shadow-xl group">
                  {m.imageUrl && (
                    <div className="h-40 bg-slate-950 overflow-hidden">
                      <img src={m.imageUrl} alt={m.title} className="w-full h-full object-cover group-hover:scale-105 transition-all duration-300" />
                    </div>
                  )}
                  <div className="p-5 flex-1 flex flex-col">
                    <div className="flex justify-between items-center mb-2">
                      <span className="bg-emerald-500/10 text-emerald-400 text-[10px] font-bold px-2.5 py-0.5 rounded-lg border border-emerald-500/20">
                        Kelas {m.kelas}
                      </span>
                      <span className="text-[11px] text-amber-400 font-semibold flex items-center gap-1">
                        <Clock className="w-3 h-3"/> {m.durationMinutes || 15} Menit
                      </span>
                    </div>

                    <h3 className="font-bold text-white text-sm mb-2 group-hover:text-blue-400 transition-colors leading-snug">{m.title}</h3>
                    <p className="text-xs text-slate-400 line-clamp-3 mb-4 leading-relaxed">{m.content}</p>

                    <button 
                      onClick={() => handleOpenMaterial(m)}
                      className="mt-auto w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-2.5 rounded-xl text-xs transition-all shadow-md shadow-blue-600/20 flex justify-center items-center gap-2 active:scale-95"
                    >
                      <BookOpen className="w-4 h-4"/> Buka & Baca Materi
                    </button>
                  </div>
                </div>
              ))}

              {availableMaterials.length === 0 && (
                <div className="col-span-full bg-slate-900/50 border border-dashed border-slate-800 rounded-3xl p-12 text-center text-slate-500 space-y-3">
                  <BookOpen className="w-10 h-10 mx-auto text-slate-600 animate-bounce" />
                  <p className="font-semibold text-xs">Belum ada materi IPS yang diterbitkan oleh Guru untuk Kelas {studentSession.kelas}.</p>
                  <p className="text-[11px] text-slate-600">Materi akan muncul secara otomatis ketika guru menerbitkan materi baru dari Portal Guru.</p>
                </div>
              )}
            </div>
          </main>
        </div>
      );
    }

    const root = createRoot(document.getElementById('root'));
    root.render(<StudentApp />);
  </script>
</body>
</html>
